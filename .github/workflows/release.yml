name: Create Chrome Extension Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'What type of release is this?'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Determine Version and Tag
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if ! [[ "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json version must be numeric major.minor.patch: $PACKAGE_VERSION"
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            IFS='.' read -ra VER <<< "$PACKAGE_VERSION"

            if [ "${{ github.event.inputs.bump_type }}" = "major" ]; then
              NEW_VERSION="$((VER[0]+1)).0.0"
            elif [ "${{ github.event.inputs.bump_type }}" = "minor" ]; then
              NEW_VERSION="${VER[0]}.$((VER[1]+1)).0"
            else
              NEW_VERSION="${VER[0]}.${VER[1]}.$((VER[2]+1))"
            fi

            echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=v$NEW_VERSION" >> "$GITHUB_ENV"
            echo "Calculated release version from package.json: $NEW_VERSION"
          else
            TAG_VERSION="${GITHUB_REF_NAME#v}"

            if [ "$GITHUB_REF_NAME" != "v$PACKAGE_VERSION" ]; then
              echo "Tag $GITHUB_REF_NAME does not match package.json version $PACKAGE_VERSION."
              echo "Update package.json and run npm run version:sync before creating the tag."
              exit 1
            fi

            if ! [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tags must use vMAJOR.MINOR.PATCH format."
              exit 1
            fi

            echo "NEW_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi

      - name: Bump Canonical Version and Create Tag
        if: github.event_name == 'workflow_dispatch'
        env:
          NEW_VERSION: ${{ env.NEW_VERSION }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          TARGET_REF: ${{ github.ref_name }}
        shell: bash
        run: |
          npm version "$NEW_VERSION" --no-git-tag-version
          npm run version:sync
          npm run version:check

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json public/manifest.json
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git push origin HEAD:"$TARGET_REF"

          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag $RELEASE_TAG already exists locally. Refusing to move it."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag $RELEASE_TAG already exists on origin. Refusing to move it."
            exit 1
          fi

          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Verify Version Metadata
        run: npm run version:check

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Verify Built Manifest Version
        shell: bash
        run: |
          BUILT_VERSION=$(node -p "require('./dist/manifest.json').version")
          if [ "$BUILT_VERSION" != "${{ env.NEW_VERSION }}" ]; then
            echo "dist/manifest.json version $BUILT_VERSION does not match release version ${{ env.NEW_VERSION }}."
            exit 1
          fi

      - name: Prepare Filename
        shell: bash
        run: |
          RAW_NAME=$(node -p "require('./public/manifest.json').name")
          CLEAN_NAME="${RAW_NAME// /_}"
          echo "FILENAME=${CLEAN_NAME}_v${{ env.NEW_VERSION }}.zip" >> "$GITHUB_ENV"

      - name: Create Zip of dist/
        shell: bash
        run: |
          cd dist
          zip -r "../${{ env.FILENAME }}" .

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ env.RELEASE_TAG }}" "${{ env.FILENAME }}" \
            --title "Release ${{ env.RELEASE_TAG }}" \
            --generate-notes
